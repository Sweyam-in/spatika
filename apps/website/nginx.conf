server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Directory redirects (/components/button → /components/button/) stay relative, so they keep
    # the scheme, host and port the visitor used — behind the TLS tunnel or a mapped port alike.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml application/manifest+json;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The version list is read by every snapshot; it must always be fresh.
    location = /versions.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Versioned docs (scripts/release-docs.mjs). Snapshot assets are immutable.
    location ~ ^/(docs/v[^/]+|next)/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A full snapshot serves its own pages (and its own index.html for client routes). A
    # version with only an archive.json falls through to the latest site, whose archive viewer
    # renders the API and release notes reconstructed for that version.
    location ~ ^/docs/(v[^/]+)(/.*)?$ {
        try_files $uri $uri/index.html /docs/$1/index.html /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /next/ {
        try_files $uri $uri/index.html /next/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
